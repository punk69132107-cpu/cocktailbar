<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>隠れ家來人カクテルシミュレーター (試作) (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラムの「問診カード」。上に進捗、中央に設問、最後におすすめ3杯とレシピ */
:root {
  --bg: #f4f2ef;
  --surface: #ffffff;
  --ink: #1f1a1d;
  --muted: #6b6168;
  --line: #ddd5d6;
  --accent: #7a2a3a;
  --accent-soft: #f3e4e7;
  --brass: #9a7230;
  --brass-soft: #f4ecdc;
  --glass: #8a8f96;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151114; --surface: #1f191d; --ink: #efe8ea; --muted: #a99ea4; --line: #382e33;
    --accent: #e08a9c; --accent-soft: #3a1f27; --brass: #d6aa5e; --brass-soft: #33291a; --glass: #b4bac2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151114; --surface: #1f191d; --ink: #efe8ea; --muted: #a99ea4; --line: #382e33;
  --accent: #e08a9c; --accent-soft: #3a1f27; --brass: #d6aa5e; --brass-soft: #33291a; --glass: #b4bac2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
.notice {
  background: var(--brass-soft); border: 1px solid var(--brass); border-radius: 10px;
  padding: 10px 14px; font-size: 13.5px; line-height: 1.6;
}
.notice b { color: var(--brass); }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.3; margin: 0; letter-spacing: .02em; }
.brand small { display: block; font-family: var(--font-body); font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: .06em; }
.progress { display: grid; gap: 6px; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.bars span { height: 6px; border-radius: 3px; background: var(--line); }
.bars span.done { background: var(--accent); opacity: .45; }
.bars span.now { background: var(--accent); }
.pcap { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pcap b { color: var(--ink); }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; display: grid; gap: 16px; min-width: 0;
}
.stage {
  justify-self: start; font-size: 12.5px; font-weight: 700; letter-spacing: .08em;
  color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 12px;
}
.scene { margin: 0; color: var(--muted); }
.ask { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.5; margin: 0; text-wrap: balance; }
.choices { display: grid; gap: 10px; }
.choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice {
  display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 12px;
  width: 100%; text-align: left; font: inherit; font-weight: 500; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 12px 14px; cursor: pointer; transition: border-color .15s, background .15s;
}
.choice:hover { border-color: var(--accent); background: var(--accent-soft); }
.choice .num { font-family: var(--font-body); }
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
.choice small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; line-height: 1.5; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums;
}
.tips { display: flex; flex-wrap: wrap; gap: 8px; }
.tip {
  font: inherit; font-size: 13.5px; color: var(--brass); background: transparent;
  border: 1px solid var(--brass); border-radius: 999px; padding: 4px 14px; cursor: pointer;
}
.tip:hover { background: var(--brass-soft); }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
  background: var(--accent); color: var(--surface);
}
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; color: var(--muted); }
.chip.hit { border-color: var(--accent); color: var(--accent); }

/* 結果 */
.pick { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.pick:first-of-type { border-top: 0; padding-top: 0; }
.art { align-self: start; background: var(--brass-soft); border-radius: 14px; padding: 8px 4px; display: grid; place-items: center; }
.pick svg { width: 96px; height: 125px; display: block; }
.pick-body { display: grid; gap: 8px; min-width: 0; }
.pick-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.rank { font-size: 12px; font-weight: 700; color: var(--brass); letter-spacing: .08em; }
.pname { font-family: var(--font-display); font-weight: 700; font-size: 21px; margin: 0; line-height: 1.35; }
.pname span { font-family: var(--font-body); font-size: 12.5px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.match { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); font-size: 14px; }
.meta { font-size: 13px; color: var(--muted); margin: 0; }
.fun { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.6; color: var(--accent); }
.notice { margin: 14px 0; padding: 12px 14px; border-radius: 12px; background: var(--brass-soft); }
.notice p { margin: 0; }
.notice.pay { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; }
.notice.pay span { font-weight: 700; }
.nomi-h { font-family: var(--font-display); font-weight: 700; font-size: 16px; margin-bottom: 4px !important; }
.nomi-p { font-size: 15px; margin-bottom: 2px !important; }
.nomi-p b { font-size: 19px; }
.pick.special { border: 1.5px dashed var(--brass, #b8893f); }
.recipe { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 14.5px; }
.recipe li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dotted var(--line); padding-block: 2px; }
.recipe li b { font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.talk { margin: 0; font-size: 14px; background: var(--brass-soft); border-radius: 8px; padding: 8px 12px; }
.talk::before { content: "バーテンダーより　"; font-weight: 700; color: var(--brass); font-size: 12.5px; }
.order { margin: 0; padding: 10px 14px; border: 1.5px solid var(--accent); border-radius: 10px; color: var(--accent); font-weight: 700; text-align: center; }
.small { font-size: 13px; color: var(--muted); margin: 0; }

.type { display: grid; gap: 8px; padding: 18px; border-radius: 12px; background: var(--accent-soft); }
.type-eyebrow { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }
.type-name { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.4; margin: 0; text-wrap: balance; }
.type-name span { font-size: 16px; margin-left: 4px; color: var(--muted); }
.type-desc { margin: 0; }
.overlay {
  position: fixed; inset: 0; background: rgba(15, 10, 12, .55); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal {
  background: var(--surface); color: var(--ink); border-radius: 14px; width: min(520px, 100%);
  max-height: 100%; overflow-y: auto; padding: 22px; display: grid; gap: 14px;
}
.modal h3 { font-family: var(--font-display); font-size: 20px; margin: 0; color: var(--brass); }
.modal p { margin: 0; white-space: pre-line; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 480px) {
  .ask { font-size: 19px; }
  .card { padding: 16px; }
  .choices.two { grid-template-columns: 1fr; }
  .pick { grid-template-columns: 84px minmax(0, 1fr); gap: 12px; }
  .pick svg { width: 76px; height: 99px; }
}

/* オープニング */
.opening{position:fixed;inset:0;z-index:50;border:0;padding:0;margin:0;width:100%;background:#0d080a;color:#f6ecdc;cursor:pointer;overflow:hidden;font:inherit;text-align:center;transition:opacity .8s ease,visibility .8s}
.opening.leaving{opacity:0;visibility:hidden}
.op-bg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(28px) brightness(.45) saturate(1.2)}
.op-col{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:max(22px,env(safe-area-inset-bottom,0px))}
.op-photo{position:relative;flex:1 1 60%;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.op-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block;animation:zoom 14s ease-out both}
.op-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(13,8,10,.75),transparent 28%)}
.op-text{position:relative;margin-top:-56px;padding:0 24px;display:grid;gap:10px;justify-items:center}
.op-hello{margin:0;font-size:14px;letter-spacing:.5em;color:#d6aa5e;padding-left:.5em}
.op-title{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(26px,8vw,36px);line-height:1.45;letter-spacing:.06em;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.op-title b{display:block;color:#f2cf8a;font-size:1.18em;letter-spacing:.14em}
.op-sub{margin:0;font-size:14px;line-height:1.8;color:#d9cdd1}
.op-go{margin-top:8px;font-weight:700;letter-spacing:.2em;font-size:15px;color:#1a1013;background:linear-gradient(#f2cf8a,#d6aa5e);border-radius:999px;padding:13px 34px;box-shadow:0 0 0 0 rgba(242,207,138,.6);animation:pulse 2.2s infinite}
.op-warn{margin:6px 0 0;font-size:11.5px;color:#a99ea4}
.op-top{position:absolute;top:max(16px,env(safe-area-inset-top,0px));left:0;right:0;font-size:12px;letter-spacing:.35em;color:#d6aa5e;opacity:.9;z-index:2}
.sp{position:absolute;bottom:-10px;border-radius:50%;background:radial-gradient(#ffe7a8,rgba(255,200,100,0) 70%);animation:rise linear infinite;opacity:0}
.op-text>*{opacity:0;animation:fadeup .9s ease forwards}
.op-text>:nth-child(1){animation-delay:.4s}.op-text>:nth-child(2){animation-delay:.9s}.op-text>:nth-child(3){animation-delay:1.5s}.op-text>:nth-child(4){animation-delay:2.1s}.op-text>:nth-child(5){animation-delay:2.4s}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,207,138,.55)}70%,100%{box-shadow:0 0 0 18px rgba(242,207,138,0)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-70vh);opacity:0}}
.wrap.enter{animation:fadeup .8s ease both}
@media (prefers-reduced-motion:reduce){.op-photo img,.op-go,.sp{animation:none}.op-text>*{animation:none;opacity:1}.opening{transition:none}.wrap.enter{animation:none}}
</style>

/* カクテルの scene（first/meal/after/last）を、気分タグに変換（味・強さ・炭酸などから自動で補う） */
COCKTAILS.forEach(c => {
  const o = c.scene, s = new Set(), long = c.glass !== 'cocktail' && c.glass !== 'coupe';
  if (o.includes('first')) s.add('quick'); if (o.includes('meal')) s.add('talk'); if (o.includes('after')) s.add('chill'); if (o.includes('last')) s.add('slow');
  if (c.fizz) s.add('quick');
  if (c.str <= 1 && long) s.add('talk');
  if (c.taste.includes('sweet') && (c.fizz || c.flavor.includes('fruit'))) s.add('lively');
  if (c.str >= 2 || c.taste.includes('bitter') || c.taste.includes('rich')) s.add('slow');
  if (c.flavor.includes('cream')) s.add('chill');
  c.scene = [...s];
});

/* 出題のランダム化：前回までに出した設問を覚えて、まだ出していないものを優先する
   （同じ端末で続けて使うグループでも、同じ質問が繰り返されにくい） */
const SEEN_KEY = 'cocktailSimSeenQ';
let memSeen = [], personaSet = [];
function loadSeen() { try { const v = JSON.parse(localStorage.getItem(SEEN_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return memSeen; } }
function saveSeen(a) { memSeen = a; try { localStorage.setItem(SEEN_KEY, JSON.stringify(a)); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickPersonaSet() {
  let seen = loadSeen().filter(id => PERSONA.some(p => p.id === id));
  let picked = shuffle(PERSONA.filter(p => !seen.includes(p.id))).slice(0, PERSONA_PICK);
  if (picked.length < PERSONA_PICK) { // 未出題が足りなくなったら、履歴をリセットして補充
    seen = [];
    picked = picked.concat(shuffle(PERSONA.filter(p => !picked.includes(p))).slice(0, PERSONA_PICK - picked.length));
  }
  saveSeen(seen.concat(picked.map(p => p.id)));
  return picked;
}

/* 性格診断の回答を、具体的な好みに置き換える */
function personaToPrefs() {
  const pts = { t: {}, f: {}, z: {}, sc: {} };
  personaSet.forEach(s => {
    const c = s.choices.find(c => c.t === answers[s.id]);
    if (c) c.w.forEach(w => { const [k, v] = w.split(':'); pts[k][v] = (pts[k][v] || 0) + 1; });
  });
  const top = (o, def) => Object.keys(o).sort((a, b) => o[b] - o[a])[0] || def;
  const z = pts.z.yes === pts.z.no ? 'any' : top(pts.z, 'any');
  return { taste: top(pts.t, 'fresh'), flavor: top(pts.f, 'citrus'), fizz: z, scene: top(pts.sc, 'talk'), strength: answers.strength, base: 'any' };
}
function chips(a, persona) {
  const out = [TASTE[a.taste], STR[a.strength]];
  if (!persona && a.strength !== 0) out.push(a.base === 'any' ? 'ベースおまかせ' : BASE[a.base]);
  out.push(FLAVOR[a.flavor], a.fizz === 'yes' ? '炭酸あり' : a.fizz === 'no' ? '炭酸なし' : '炭酸どちらでも', SCENE[a.scene]);
  return out.map(t => `<span class="chip">${esc(t)}</span>`).join('');
}

}

  modal.innerHTML = `<h3 id="mTitle">${esc(t.q)}</h3><p>${esc(t.a)}</p><div class="row"><button class="btn" type="button" id="mClose">閉じる</button></div>`;
  overlay.hidden = false; $('#mClose').focus();
  $('#mClose').onclick = closeModal;
}
function closeModal() { overlay.hidden = true; }
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) closeModal(); });
function toTop() { window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }

render();

/* オープニング：タップでカクテルシミュレーターへ */
(function () {
  const op = $('#opening'), app = $('#app'), sp = $('#sparks');
  for (let k = 0; k < 14; k++) {
    const e = document.createElement('i'), s = 4 + Math.random() * 8;
    e.className = 'sp';
    e.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-duration:${6 + Math.random() * 7}s;animation-delay:${Math.random() * 6}s`;
    sp.appendChild(e);
  }
  op.addEventListener('click', () => {
    app.hidden = false; app.classList.add('enter');
    op.classList.add('leaving');
    window.scrollTo(0, 0);
    setTimeout(() => op.remove(), 900);
  });
  op.focus();
})();
</script>
